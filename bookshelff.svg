<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372" role="img" aria-label="The Library: Fantasy books, Fourth Wing, Algorithms to Live By, Data Structures and Algorithms, Hash Maps, Embedded Systems, Systems Engineering, and an unread TBR pile">
  <style>
    .book { transform-box: fill-box; transform-origin: 50% 100%; animation: pop 10s ease-in-out infinite; }
    @keyframes pop {
      0%, 64%, 100% { transform: translateY(0) rotate(0deg); }
      71% { transform: translateY(-14px) rotate(-2.5deg); }
      78% { transform: translateY(-8px) rotate(1.5deg); }
      85% { transform: translateY(0) rotate(0deg); }
    }
    .title { font-family: Georgia, 'Times New Roman', serif; letter-spacing: 1.2px; }
    .cap { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #8a7a5c; }
